# KT Game Booster v1.0 - configuração padrão
# Mantenha este arquivo ao lado de KTGameBooster.exe para personalizar o motor.
# Se ele estiver ausente ou inválido, os padrões incorporados serão usados.

[config]
poll_interval_ms = 1000

[features]
dwm_mmcss = true
dwm_thread_priority = true
gpu_priority = true
background_limiter = true
thread_power_background_throttle = true
thread_power_game_unthrottle = true
io_priority_background = true
io_priority_game_high = true
eco_qos_background = true
suspend_gameinput_threads = false
disable_c_states = false
disable_priority_boost = true
background_cpu_pin = false
boost_input_threads = true
# Governor automático do jogo: baixa latência, prioridade de memória e
# acompanhamento de threads sem precisar abrir a tela Governor.
mmcss_game = true
page_priority_game = true
memory_priority_game_high = true
memory_compression_disable = false
gpu_hardware_scheduling = false
auto_profile_switching = false
# Segurança anticheat: quando um jogo com AC de kernel/de linha lançamentos
# (Valorant, Fortnite, CoD, PUBG...) é detectado, a sessão desliga
# automaticamente suspensão de threads/serviços e o limitador de fundo,
# mantendo só os levers user-mode que não acionam o anticheat.
anticheat_safe_mode = true
# Par de planos de energia gaming (GUIDs hex sem traco, ex.: 8c5e7fda...)
# gaming_power_plans = true
# power_plan_game_guid = "..."
# power_plan_off_guid = "..."
gaming_power_plans = false
power_plan_game_guid = ""
power_plan_off_guid = ""

# Foco no processo escolhido + serviços
game_tree_boost = true
pause_services_gaming = false

# Alavancas de FPS v2.1
# Game DVR/GameBar capture off durante a sessão (reversível, HKCU)
game_dvr_disable = true
# Monitor de FPS/frame-time real via ETW Present (dashboard)
fps_monitor = true

[background_cpu]
auto_load = false
main_frame_cpu_pct = 20
worker_cpu_pct = 3
cpus = []

